name: Validate APEX Crypto War Room
on:
  push:
    branches:
      - feat/paper-trading-meme-markets-testnet-connection
      - feat/evidence-council-agents
      - fix/kraken-live-market-fallback-and-council
      - feat/public-users-isolated-testnet-wallets
  pull_request:
    branches:
      - feat/apex-war-room-completion
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Test paper trading risk controls
        working-directory: web
        run: npx vitest run src/lib/paper-trading.test.ts src/lib/council-analysis.test.ts functions/api/market-fallback.test.ts functions/_lib/security.test.ts
      - name: Typecheck and compile Cloudflare Pages dashboard
        working-directory: web
        run: npm run build

      - name: Typecheck Cloudflare Pages council functions
        working-directory: web
        run: npx tsc --noEmit --target ES2022 --lib ES2022,DOM --module ESNext --moduleResolution bundler --skipLibCheck functions/api/council.ts
      - name: Typecheck new email signup and session endpoints
        working-directory: web
        run: npx tsc --noEmit --target ES2022 --lib ES2022,DOM --module ESNext --moduleResolution bundler --skipLibCheck functions/api/auth/\\[\\[path\\]\\].ts
      - name: Typecheck individual user account and Binance endpoints
        working-directory: web
        run: npx tsc --noEmit --target ES2022 --lib ES2022,DOM --module ESNext --moduleResolution bundler --skipLibCheck functions/api/private/\[\[path\]\].ts
