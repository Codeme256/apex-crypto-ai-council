name: Verify Crypto Council Frontend
on:
  push:
    branches:
      - feat/continuous-agents-real-binance-account-20261113
      - feat/bybit-binance-live-api-connect-20261113
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/verify-crypto-council-frontend.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Execute 2% execution-risk unit tests
        working-directory: web
        run: npx vitest run src/lib/execution-risk-2pct.test.ts
      - name: Typecheck and production build
        working-directory: web
        run: npm run build
