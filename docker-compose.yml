services:
  apex-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      MARKET_SYMBOLS: ${MARKET_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  apex-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${APEX_WEB_PORT:-8080}:80"
    depends_on:
      apex-api:
        condition: service_healthy
    restart: unless-stopped

# Read-only public market data only. No exchange credentials or order execution.
